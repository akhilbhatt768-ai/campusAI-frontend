`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI - Your Academic AI Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-layout">
        <!-- Header / Navbar -->
        <header class="header shadow-sm">
            <div class="container d-flex align-items-center py-3 px-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="logo-icon bg-primary text-white rounded-circle d-flex align-items-center justify-content-center">
                        <i class="bi bi-robot"></i>
                    </div>
                    <div>
                        <h1 class="h5 mb-0 fw-semibold text-dark">CampusAI</h1>
                        <p class="mb-0 text-muted small tagline">Your Academic AI Assistant</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-container flex-grow-1" id="chatContainer">
            <div class="container py-4 px-4" id="chatMessages">
                <!-- Welcome Message from AI -->
                <div class="message-wrapper ai-message">
                    <div class="message-avatar">
                        <div class="logo-icon bg-primary text-white rounded-circle d-flex align-items-center justify-content-center">
                            <i class="bi bi-robot"></i>
                        </div>
                    </div>
                    <div class="message-content">
                        <div class="message-bubble">
                            <p class="mb-0">Hello! I'm CampusAI. How can I assist you with your studies or questions today?</p>
                        </div>
                        <div class="message-meta">
                            <span class="timestamp" id="welcomeTimestamp">Just now</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Section -->
        <footer class="input-section border-top py-3">
            <div class="container px-4">
                <form id="chatForm" class="chat-form position-relative">
                    <textarea 
                        id="chatInput" 
                        class="form-control rounded-4 shadow-sm" 
                        placeholder="Type your question here (Press Enter to send)..." 
                        rows="1"
                        autocomplete="off"
                        autofocus
                    ></textarea>
                    <button type="submit" id="sendBtn" class="btn btn-primary rounded-circle position-absolute bottom-0 end-0 mb-1 me-2" disabled>
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
                <div class="text-center mt-2">
                    <small class="text-muted" style="font-size: 0.75rem;">CampusAI attempts to provide accurate academic information, but may make mistakes. Always verify with your primary sources.</small>
                </div>
            </div>
        </footer>
    </div>

    <!-- Script Application -->
    <script src="script.js"></script>
</body>
</html>
